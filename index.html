<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SDA Church – Welcome Visitors</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>👋 Welcome, Visitor!</h1>
                <p>We are so glad you joined us today.<br>Please share your details so we can welcome you personally.</p>
            </div>
            <form id="visitorForm">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" required placeholder="e.g. John Mensah">
                </div>
                <div class="form-group">
                    <label>WhatsApp Number *</label>
                    <input type="tel" id="whatsapp" required placeholder="+233 XX XXX XXXX">
                    <small>Include country code (e.g. +233 for Ghana)</small>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>How did you hear about us?</label>
                    <select id="heardFrom">
                        <option value="Friend">Friend / Family</option>
                        <option value="Social Media">Social Media</option>
                        <option value="Flyer">Flyer / Bulletin</option>
                        <option value="Service">Google Search</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Any prayer request or comment?</label>
                    <textarea id="message" rows="3" placeholder="We'd love to pray for you..."></textarea>
                </div>
                <button type="submit" id="submitBtn">📩 Send & Get Church Info</button>
                <div id="formStatus" class="status-message"></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

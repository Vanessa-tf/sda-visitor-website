<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SDA Church – Welcome Visitors</title>
    <link rel="stylesheet" href="style.css">
    <!-- Official SDA Font: Noto Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Brand header with logo beside title -->
        <div class="brand-header">
            <div class="logo-title-group">
                <img src="sda-logo.png" alt="Seventh-day Adventist Church Logo" class="sda-logo">
                <div class="title-group">
                    <h1>We're Glad You're Here!</h1>
                    <p>Thank you for worshipping with us today.<br>Please share your details so we can welcome you personally.</p>
                </div>
            </div>
        </div>

        <div class="card">
            <form id="visitorForm">
                <!-- Two-column grid for better layout on desktop -->
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" required placeholder="e.g. John Mensah">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number *</label>
                        <input type="tel" id="whatsapp" required placeholder="+233 XX XXX XXXX">
                        <small>Include country code (e.g. +233 for Ghana)</small>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label>How did you hear about us?</label>
                        <select id="heardFrom">
                            <option value="Friend">Friend / Family</option>
                            <option value="Social Media">Social Media</option>
                            <option value="Flyer">Flyer / Bulletin</option>
                            <option value="Service">Google Search</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Any prayer request or comment?</label>
                        <textarea id="message" rows="3" placeholder="We'd love to pray for you..."></textarea>
                    </div>
                </div>
                <button type="submit" id="submitBtn">📩 Send & Get Church Info</button>
                <div id="formStatus" class="status-message"></div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
